<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MoveMap</title>
<style>

:root{
  /* 기본 — 블랙 & 화이트 */
  --ink:#101014;      /* 본문 · 기본 버튼 */
  --ink2:#50505A;
  --ink3:#8A8A94;
  --bg:#F4F4F5;
  --surface:#FFFFFF;
  --line:#E1E1E6;
  --line2:#EFEFF2;
  /* 포인트 — 인디고 블루 (선택 상태 · 강조) */
  --deep:#2C46D8;
  --mid:#8092EC;
  --pale:#BCC6F5;
  --wash:#EEF1FC;
  /* 경고 · 확인 */
  --warn:#B4302A;
  --warnwash:#FBEDEB;
  --gold:#8A6714;
  --goldwash:#F6F0E1;
  --r:4px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;letter-spacing:-0.015em;line-height:1.25}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:18px;
  padding:10px 20px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:17px;letter-spacing:-0.02em;
  white-space:nowrap;border:0;background:none;padding:2px 6px 2px 0;margin:0;text-align:left;color:inherit;border-radius:var(--r)}
.brand:hover .bn{color:var(--deep)}
.brand:focus-visible{outline:2px solid var(--deep);outline-offset:2px}
.brand small{font-weight:450;font-size:12.5px;color:var(--ink3);letter-spacing:0}
.crumbs{flex:1;min-width:0;font-size:13.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topActions{display:flex;gap:8px;flex-shrink:0}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--line);background:var(--surface);
  padding:7px 14px;border-radius:var(--r);font-size:14px;font-weight:550;
}
.btn:hover{border-color:var(--mid)}
.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible{outline:2px solid var(--deep);outline-offset:2px}
.btn.primary{background:var(--deep);border-color:var(--deep);color:#fff}
.btn.primary:hover{background:#17393C}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--wash);border-color:transparent}
.btn.danger{color:var(--warn);border-color:#E4CCC6}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px}

/* ---------- layout ---------- */
main{max-width:1180px;margin:0 auto;padding:22px 20px 120px}
.split{display:grid;grid-template-columns:212px 1fr;gap:26px;align-items:start}
@media(max-width:860px){.split{grid-template-columns:1fr;gap:14px}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
.panel.flush{padding:0;overflow:hidden}
.panel h2{font-size:20px;margin-bottom:4px}
.panel h3{font-size:16px;margin-bottom:2px}
.sub{color:var(--ink2);font-size:13.5px;margin:2px 0 16px}
.hint{color:var(--ink3);font-size:12.5px}

/* ---------- step rail ---------- */
.rail{position:sticky;top:66px}
.rail ol{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
.rail li{margin:0}
.rail button{
  width:100%;text-align:left;background:none;border:0;padding:9px 12px;
  font-size:14px;color:var(--ink2);border-left:2px solid transparent;margin-left:-1px;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.rail button:hover{color:var(--ink);background:var(--wash)}
.rail button[aria-current="true"]{color:var(--ink);font-weight:650;border-left-color:var(--deep);background:var(--wash)}
.rail .count{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.rail button[aria-current="true"] .count{color:var(--deep)}
@media(max-width:860px){
  .rail{position:sticky;top:56px;z-index:30;background:var(--bg);padding:6px 0;margin:0 -20px;padding-left:20px}
  .rail ol{display:flex;gap:4px;overflow-x:auto;border-left:0;border-bottom:1px solid var(--line);padding-bottom:6px}
  .rail button{width:auto;white-space:nowrap;border-left:0;border-bottom:2px solid transparent;border-radius:var(--r)}
  .rail button[aria-current="true"]{border-left:0;border-bottom-color:var(--deep)}
}

/* ---------- chips ---------- */
.group{padding:16px 0;border-top:1px solid var(--line2)}
.group:first-child{border-top:0;padding-top:4px}
.group-head{display:flex;align-items:baseline;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.group-head h4{font-size:14.5px;font-weight:700}
.group-head .note{font-size:12.5px;color:var(--ink3)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  border:1px solid var(--line);background:var(--surface);
  padding:7px 13px;border-radius:999px;font-size:13.5px;line-height:1.3;
  display:inline-flex;align-items:center;gap:7px;
}
.chip:hover{border-color:var(--mid)}
.chip[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
.chip[aria-pressed="true"].alt{background:var(--gold);border-color:var(--gold)}
.chip[aria-pressed="true"].caution{background:var(--warn);border-color:var(--warn)}
.chip .side{font-size:11px;opacity:.75;font-weight:600}
.chip .w{font-size:11px;opacity:.6;font-variant-numeric:tabular-nums}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 13px;font-size:13px;border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--deep);color:#fff}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--line2);flex-wrap:wrap}
.rowline:first-of-type{border-top:0}
.rowline .lbl{font-size:14px}
.rowline .lbl em{display:block;font-style:normal;font-size:12px;color:var(--ink3)}

/* ---------- form ---------- */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label.f{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
}
textarea{min-height:76px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--deep);outline-offset:-1px;border-color:var(--deep)}

/* ---------- test card ---------- */
.test{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--surface)}
.test > summary{
  list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:12px;
}
.test > summary::-webkit-details-marker{display:none}
.test summary .tname{font-weight:650;font-size:15px}
.test summary .ten{font-size:12px;color:var(--ink3);margin-left:2px}
.test summary .tstate{margin-left:auto;font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:8px}
.test[open] > summary{border-bottom:1px solid var(--line2)}
.test .tbody{padding:14px 16px 16px}
.test.flagged{border-left:2px solid var(--deep)}
.badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--wash);color:var(--deep);font-weight:600}
.badge.warn{background:var(--warnwash);color:var(--warn)}
.badge.gold{background:var(--goldwash);color:var(--gold)}
.badge.quiet{background:var(--line2);color:var(--ink2)}

/* ---------- results ---------- */
.scorelist{margin:0;padding:0;list-style:none}
.scorerow{display:grid;grid-template-columns:150px 1fr 78px;gap:12px;align-items:center;padding:7px 0}
@media(max-width:620px){.scorerow{grid-template-columns:120px 1fr 62px;gap:8px}}
.scorerow .dname{font-size:13.5px;font-weight:600}
.scorerow .dname em{display:block;font-style:normal;font-weight:400;font-size:11px;color:var(--ink3)}
.track{height:16px;background:var(--line2);border-radius:2px;overflow:hidden}
.fill{height:100%;background:var(--deep)}
.fill.unconfirmed{
  background:repeating-linear-gradient(115deg,var(--pale) 0 5px,var(--wash) 5px 10px);
}
.fill.low{background:var(--mid)}
.scorerow .val{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums;text-align:right}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink3);margin-top:10px}
.legend i{display:inline-block;width:22px;height:9px;border-radius:2px;vertical-align:middle;margin-right:5px}

.prio{border:1px solid var(--line);border-left:3px solid var(--deep);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.prio.excluded{opacity:.5;border-left-color:var(--ink3)}
.prio.edited{border-left-color:var(--gold)}
.prio .ptop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.prio .rank{font-size:12px;font-weight:700;color:var(--deep)}
.prio h4{font-size:16.5px}
.prio .pen{font-size:12.5px;color:var(--ink3)}
.prio p{margin:7px 0 0;font-size:14px;color:var(--ink2)}
.prio .actions{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap;align-items:center}

.calloutbox{background:var(--wash);border-radius:var(--r);padding:14px 16px;margin:12px 0;font-size:14px}
.calloutbox.warn{background:var(--warnwash);border-left:3px solid var(--warn)}
.calloutbox h4{font-size:14.5px;margin-bottom:5px}
.calloutbox ul{margin:6px 0 0;padding-left:18px}
.calloutbox li{margin:3px 0}

table.plan{width:100%;border-collapse:collapse;font-size:13.5px}
table.plan th,table.plan td{text-align:left;vertical-align:top;padding:10px 12px;border-top:1px solid var(--line2)}
table.plan thead th{border-top:0;font-size:12px;color:var(--ink3);font-weight:600;padding-bottom:6px}
table.plan td.ph{font-weight:650;white-space:nowrap}
table.plan td.ph em{display:block;font-style:normal;font-weight:400;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
table.plan ul{margin:0;padding-left:16px}
table.plan li{margin:2px 0}

/* ---------- lists ---------- */
.memberlist{list-style:none;margin:0;padding:0}
.memberlist li{border-top:1px solid var(--line2)}
.memberlist li:first-child{border-top:0}
.memberlist button{
  width:100%;background:none;border:0;padding:14px 22px;text-align:left;
  display:flex;align-items:center;gap:14px;
}
.memberlist button:hover{background:var(--wash)}
.memberlist .mname{font-weight:650;font-size:15.5px}
.memberlist .mmeta{font-size:12.5px;color:var(--ink3)}
.memberlist .mright{margin-left:auto;text-align:right;font-size:12.5px;color:var(--ink2)}
.empty{padding:34px 22px;color:var(--ink2);font-size:14px}
.empty strong{display:block;font-size:16px;color:var(--ink);margin-bottom:4px}

.timeline{list-style:none;margin:0;padding:0}
.timeline li{padding:12px 0;border-top:1px solid var(--line2);display:flex;gap:14px;align-items:flex-start}
.timeline li:first-child{border-top:0}
.timeline .when{font-size:12px;color:var(--ink3);width:78px;flex-shrink:0;font-variant-numeric:tabular-nums}
.timeline .what{flex:1;font-size:14px}
.timeline .what strong{font-size:14px}
.timeline .what p{margin:3px 0 0;color:var(--ink2);font-size:13.5px}

/* ---------- sticky footer ---------- */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:35;
  background:rgba(255,255,255,.96);border-top:1px solid var(--line);
  padding:10px 20px;display:flex;align-items:center;gap:12px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
}
.dock .dockinfo{font-size:13px;color:var(--ink2);flex:1;min-width:0}
.dock .dockinfo b{color:var(--ink)}

.toast{
  position:fixed;left:50%;bottom:74px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:13.5px;z-index:60;
}
@media(prefers-reduced-motion:no-preference){
  .toast{animation:rise .18s ease-out}
  @keyframes rise{from{opacity:0;transform:translate(-50%,6px)}}
}
.srow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mt16{margin-top:16px}.mt24{margin-top:24px}
.divider{height:1px;background:var(--line2);margin:18px 0}


/* 로그인 */
.gate{max-width:420px;margin:8vh auto 0}
.gate .panel{padding:26px 26px 24px}
.gate h1{font-size:23px;margin-bottom:4px}
.centername{font-size:12.5px;color:var(--ink3);letter-spacing:.12em;font-weight:600}
.brandwrap{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;white-space:nowrap;gap:1px}
.brandwrap .cn{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--deep);font-weight:700;letter-spacing:.1em}
.brandwrap .cn span{color:var(--ink2);background:var(--line2);border-radius:999px;padding:1px 7px;
  font-size:10.5px;font-weight:600;letter-spacing:.04em}
.brandwrap .bn{font-size:17px;font-weight:750;letter-spacing:-0.02em}
.coachpick{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.who{font-size:12.5px;color:var(--ink2);white-space:nowrap}

/* 사진 */
.photogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.slot{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.slot .cap{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 10px;font-size:13px;font-weight:600;border-bottom:1px solid var(--line2)}
.slot .cap button{border:0;background:none;font-size:12px;color:var(--ink3);padding:2px 4px}
.slot .cap button:hover{color:var(--warn)}
.slot .box{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;background:var(--wash);position:relative}
.slot .box img{width:100%;height:100%;object-fit:cover;display:block}
.slot .box label{font-size:12.5px;color:var(--ink2);cursor:pointer;text-align:center;padding:10px}
.slot input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.scale5{display:inline-flex;gap:6px;flex-wrap:wrap}

/* 특이사항 로그 */
.notelog{list-style:none;margin:10px 0 0;padding:0}
.notelog li{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line2);font-size:14px}
.notelog li:first-child{border-top:0}
.notelog .nd{font-size:12px;color:var(--ink3);width:74px;flex-shrink:0;font-variant-numeric:tabular-nums}
.notelog .nt{flex:1}
.pill{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);margin-right:5px}

@media print{
  .topbar,.dock,.rail,.noprint{display:none !important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .panel{border:0;padding:0;margin-bottom:18px;break-inside:avoid}
  .prio{break-inside:avoid}
}

/* ---------- 폼 정렬 통일 ---------- */
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px 16px;align-items:end}
.fields .wide{grid-column:1/-1}
label.f{display:flex;align-items:baseline;gap:6px;font-size:12.5px;color:var(--ink2);margin-bottom:5px;min-height:18px}
label.f .auto{color:var(--deep);font-weight:650}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],input[type=password],input[type=email],select{
  width:100%;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
select{padding-right:6px}
textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.readonly{background:var(--wash);color:var(--ink2)}

/* ---------- 정적 관찰 좌우 정렬 ---------- */
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:0 26px}
.prow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--line2);min-height:42px}
.prow .pn{font-size:13.5px;line-height:1.3}
.lr{display:inline-flex;gap:6px}
.lr button{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  min-width:46px;height:30px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.lr button:hover{border-color:var(--mid)}
.lr button[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
.lr button.one{min-width:58px;font-weight:550}
.lr button.caution[aria-pressed="true"]{background:var(--warn);border-color:var(--warn)}

/* ---------- 서브 내비 · 요약 카드 ---------- */
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subnav button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-size:13.5px}
.subnav button[aria-current="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:15px 16px;text-align:left;width:100%}
.card:hover{border-color:var(--mid)}
.card .ct{font-size:13px;color:var(--ink2)}
.card .cv{font-size:26px;font-weight:700;letter-spacing:-0.02em;margin-top:2px}
.card .cs{font-size:12.5px;color:var(--ink3);margin-top:3px}

/* ---------- 표 ---------- */
table.grid{width:100%;border-collapse:collapse;font-size:13.5px}
table.grid th,table.grid td{text-align:left;padding:10px 12px;border-top:1px solid var(--line2);vertical-align:middle}
table.grid thead th{border-top:0;font-size:12px;color:var(--ink3);font-weight:600}
table.grid tr:hover td{background:var(--wash)}
table.grid td.num{font-variant-numeric:tabular-nums;color:var(--ink2)}
table.grid select{height:32px;font-size:13px}
.tablewrap{overflow-x:auto}
.rowbtn{background:none;border:0;font-weight:650;color:var(--ink);text-align:left;padding:0}
.rowbtn:hover{color:var(--deep);text-decoration:underline}

/* ---------- 동기화 표시 ---------- */
.syncdot{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3)}
.syncdot i{width:7px;height:7px;border-radius:50%;background:var(--pale)}
.syncdot.on i{background:var(--deep)}
.syncdot.err i{background:var(--warn)}
.note-src{font-size:11.5px;color:var(--deep);background:var(--wash);border-radius:999px;padding:1px 8px;margin-left:6px}
.mutedbox{border:1px dashed var(--line);border-radius:var(--r);padding:13px 15px;color:var(--ink2);font-size:13.5px}

/* ---------- 상단 뒤로가기 · 센터 ---------- */
.backbtn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1;color:var(--ink2);flex-shrink:0}
.backbtn:hover{border-color:var(--mid)}
.centerpick{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:30px;
  padding:0 10px;font-size:12.5px;max-width:180px}
.brandwrap .cn{max-width:200px;overflow:hidden;text-overflow:ellipsis}

/* ---------- 하단 탭바 ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:36;display:grid;grid-template-columns:repeat(5,1fr);
  align-items:end;background:rgba(255,255,255,.97);border-top:1px solid var(--line);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;color:var(--ink3);padding:4px 0}
.tabbar button .ic{font-size:17px;line-height:1}
.tabbar button[aria-current="true"]{color:var(--deep);font-weight:650}
.tabbar .addbtn{margin-top:-16px}
.tabbar .addbtn .ic{width:46px;height:46px;border-radius:50%;background:var(--deep);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:300}
body.hastabs main{padding-bottom:96px}

/* ---------- 사진 썸네일 ---------- */
.photogrid.small{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:9px}
.photogrid.small .box{aspect-ratio:1/1}
.photogrid.small .cap{padding:5px 8px;font-size:12px}

/* ---------- 설정 목록 ---------- */
.setlist{list-style:none;margin:0;padding:0}
.setlist li{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 0;border-top:1px solid var(--line2);font-size:14px}
.setlist li:first-child{border-top:0}
.setlist .sv{color:var(--ink2);font-size:13.5px;text-align:right}
.newsitem{display:block;border-top:1px solid var(--line2);padding:13px 0;text-decoration:none;color:inherit}
.newsitem:first-of-type{border-top:0}
.newsitem strong{display:block;font-size:14.5px}
.newsitem span{font-size:12.5px;color:var(--ink3)}
.perm{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- 정렬 통일 ---------- */
.fields{grid-auto-rows:min-content;align-items:stretch}
.fields>div{min-width:0;display:flex;flex-direction:column;justify-content:flex-end}
.fields>div>label.f{flex:0 0 auto}
.fields textarea{min-height:68px}
.fields input,.fields select,.fields textarea{margin:0}
label.f{min-height:20px;line-height:1.35;align-items:center}
.group{padding:18px 0}
.group-head{align-items:center;margin-bottom:11px}
.panel h3{margin-bottom:2px}
.panel>.srow+.mt16{margin-top:16px}
.setlist li{align-items:flex-start}
.setlist .sv{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.chips{align-items:center}
.seg button{white-space:nowrap}
.rowline{align-items:center}
table.grid th,table.grid td{vertical-align:middle}
table.grid td.act{white-space:nowrap;text-align:right}
.srow>.btn{flex:0 0 auto}
.cards{align-items:stretch}
.card{display:flex;flex-direction:column;justify-content:flex-start}
.tablewrap table{min-width:100%}
.mutedbox{margin-top:0}

/* ---------- 버튼은 검정, 선택 상태는 포인트 컬러 ---------- */
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#000;border-color:#000}
.loginmode button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tabbar .addbtn .ic{background:var(--ink)}

/* ---------- 문진 ---------- */
.secnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.secnav button{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:7px 14px;font-size:13.5px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.secnav button[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.secnav button .n{font-size:11px;font-variant-numeric:tabular-nums;
  background:var(--deep);color:#fff;border-radius:999px;padding:0 6px;min-width:17px;text-align:center}
.secnav button[aria-current="true"] .n{background:#fff;color:var(--ink)}
.condbox{border:1px solid var(--line);border-left:3px solid var(--deep);border-radius:var(--r);
  padding:14px 16px;margin-top:10px;background:var(--surface)}
.condbox>.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.condbox>.ch strong{font-size:14.5px}
.condbox.main{border-left-color:var(--ink);background:var(--surface)}
.condbox .chip.sm{padding:4px 11px;font-size:12.5px}
.condbox>.ch .srow{flex-wrap:nowrap}
.sitegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 22px}
.siterow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;
  padding:6px 0;border-bottom:1px solid var(--line2);min-height:40px}
.siterow .sn{font-size:13.5px}
.siterow .lr button{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  min-width:44px;height:29px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.siterow .lr button[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
.urgentbar{background:var(--warnwash);border:1px solid #E6C9C3;border-left:3px solid var(--warn);
  border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.urgentbar h4{font-size:15px;color:var(--warn);margin-bottom:6px}
.urgentbar ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}
.urgentbar p{margin:8px 0 0;font-size:13px;color:var(--ink2)}
.rowdel{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);
  padding:3px 9px;font-size:12px;color:var(--ink2)}
.rowdel:hover{color:var(--warn);border-color:#E4CCC6}
.sumline{font-size:14px;line-height:1.9}
.sumline .pill{margin-right:6px}

/* ---------- 로그인 모드 선택 ---------- */
.loginmode{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:999px;
  overflow:hidden;background:var(--surface);margin:0 0 18px}
.loginmode button{border:0;background:none;padding:11px 0;font-size:14px;font-weight:600;color:var(--ink2);line-height:1.2}
.loginmode button[aria-pressed="true"]{background:var(--deep);color:#fff}
.loginmode button em{display:block;font-style:normal;font-size:11px;font-weight:450;opacity:.8;margin-top:1px}
.modehint{font-size:12.5px;color:var(--ink3);margin:-10px 0 16px}

/* ---------- 설정 목록 보조설명 ---------- */
.setlist em.sethint{display:block;font-style:normal;font-size:12px;color:var(--ink3);margin-top:2px}
.setlist li>span:first-child{font-weight:550}
table.grid td.act{white-space:nowrap;text-align:right}
table.grid td.act .btn{margin-left:6px}
table.grid input[type=text]{height:32px;font-size:13px}
.brandwrap .cn span{color:var(--gold)}
@media(max-width:620px){
  .crumbs{display:none}
  .gate{margin:4vh auto 0}
  .gate .panel{padding:20px 18px}
  main{padding:16px 14px 120px}
  .panel{padding:16px 15px}
}

/* ---------- Supabase 동기화 ---------- */
const Sync={
  cfg(){return DB.sync||{};},
  on(){const c=this.cfg();return !!(c.url&&c.key&&c.space);},
  state:{busy:false,last:null,error:null},
  head(){const c=this.cfg();return{apikey:c.key,Authorization:"Bearer "+c.key,"Content-Type":"application/json"};},
  async pull(){
    if(!this.on())return null;const c=this.cfg();
    const r=await fetch(`${c.url.replace(/\/$/,"")}/rest/v1/movemap_data?center=eq.${encodeURIComponent(c.space)}&select=payload`,{headers:this.head()});
    if(!r.ok)throw new Error("불러오기 실패 ("+r.status+")");
    const j=await r.json();return j.length?j[0].payload:null;},
  async push(p){
    if(!this.on())return false;const c=this.cfg();
    const r=await fetch(`${c.url.replace(/\/$/,"")}/rest/v1/movemap_data?on_conflict=center`,
      {method:"POST",headers:Object.assign(this.head(),{Prefer:"resolution=merge-duplicates"}),
       body:JSON.stringify([{center:c.space,payload:p,updated_at:new Date().toISOString()}])});
    if(!r.ok)throw new Error("보내기 실패 ("+r.status+")");return true;},
  async run(silent){
    if(!this.on()||this.state.busy)return false;
    this.state.busy=true;this.state.error=null;
    try{const remote=await this.pull();if(remote)DB=mergeDB(DB,remote);
      await this.push(DB);
      this.state.last=new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
      await saveLocal();if(!silent)toast("동기화했습니다");return true;
    }catch(e){this.state.error=e.message||"연결 실패";if(!silent)toast("동기화 실패: "+this.state.error);return false;}
    finally{this.state.busy=false;}}
};
function mergeList(a,b){const map={};
  [...(a||[]),...(b||[])].forEach(x=>{if(!x||!x.id)return;
    const c=map[x.id];if(!c||(x.updatedAt||0)>=(c.updatedAt||0))map[x.id]=x;});
  return Object.values(map);}
function mergeDB(local,remote){
  const out=Object.assign({},remote,local);
  ["centers","admins","staff","roles","rooms"].forEach(k=>out[k]=mergeList(local[k],remote[k]));
  out.members=mergeList(local.members,remote.members).map(m=>{
    const l=(local.members||[]).find(x=>x.id===m.id),r=(remote.members||[]).find(x=>x.id===m.id);
    if(!l||!r)return m;
    const base=Object.assign({},(l.updatedAt||0)>=(r.updatedAt||0)?l:r);
    base.assessments=mergeList(l.assessments,r.assessments);
    base.sessions=mergeList(l.sessions,r.sessions);
    base.notes=mergeList(l.notes,r.notes);
    return base;});
  out.sync=local.sync&&local.sync.url?local.sync:remote.sync;
  return out;}

   채점 · 우선순위
   ============================================================ */
function score(a){
  const d={};DORDER.forEach(k=>d[k]={static:0,move:0,cue:0,total:0,from:{static:[],move:[]}});
  Object.keys(a.statics||{}).forEach(k=>{
    if(!a.statics[k])return;const it=STATIC_INDEX[baseId(k)];if(!it)return;
    Object.entries(it.w).forEach(([dom,w])=>{d[dom].static+=w;d[dom].from.static.push(it.t+(sideOf(k)?" "+sideOf(k):""));});
  });
  Object.entries(a.tests||{}).forEach(([tid,rec])=>{
    if(!rec||!rec.items)return;const T=TEST_INDEX[tid];if(!T)return;
    Object.keys(rec.items).forEach(k=>{
      if(!rec.items[k])return;const it=T.index[baseId(k)];if(!it)return;
      Object.entries(it.w).forEach(([dom,w])=>{d[dom].move+=w;d[dom].from.move.push(T.name+" · "+it.t+(sideOf(k)?" "+sideOf(k):""));});
    });
  });
  const c=a.cues||{};
  if(c.eyesclosed==="뚜렷이 저하"){d.foot.cue+=1;d.hipstab.cue+=1;}
  if(c.lowload==="낮음")d.integration.cue+=1;
  if(c.sidediff&&c.sidediff!=="없음")d.pelvis.cue+=1;
  DORDER.forEach(k=>d[k].total=d[k].static+d[k].move+d[k].cue);
  return d;
}
function priorities(a){
  const d=score(a);
  let list=DORDER.map(k=>({dom:k,...d[k],confirmed:d[k].move>0})).filter(x=>x.total>0);
  list.sort((x,y)=>y.move!==x.move?y.move-x.move:y.total-x.total);
  const ov=a.overrides||{};
  list.forEach(x=>x.state=ov[x.dom]||"agree");
  const active=list.filter(x=>x.state!=="exclude");
  let ranked=active.filter(x=>x.state!=="demote").concat(active.filter(x=>x.state==="demote"));
  (a.addons||[]).forEach(dom=>{if(!ranked.find(x=>x.dom===dom))
    ranked.unshift({dom,static:0,move:0,cue:0,total:0,confirmed:false,state:"manual",from:{static:[],move:[]}});});
  return {scores:d,all:list,ranked};
}
function suggestions(a){
  const {scores}=priorities(a);const out=[];
  DORDER.forEach(dom=>{const s=scores[dom];
    if(s.static>=2&&s.move===0){
      const tests=(DOMAINS[dom].retest||[]).filter(t=>{const r=a.tests[t];return !r||!r.done;});
      if(tests.length)out.push({dom,tests});
    }});
  return out;
}

/* ============================================================
   세션 전략
   ============================================================ */
const PHASES=[
  {key:"A",name:"평가 확인과 감각 인지",ratio:.15},
  {key:"B",name:"1순위 기초 조절",ratio:.25},
  {key:"C",name:"1·2순위 심화와 부하",ratio:.30},
  {key:"D",name:"전신 통합",ratio:.18},
  {key:"E",name:"재평가와 다음 단계",ratio:.12}
];
function splitSessions(n){
  if(n<=3)return[{...PHASES[0],from:1,to:1},{...PHASES[2],from:2,to:Math.max(2,n-1)},{...PHASES[4],from:n,to:n}];
  const raw=PHASES.map(p=>p.ratio*n);
  let alloc=raw.map(r=>Math.max(1,Math.floor(r)));
  let diff=n-alloc.reduce((a,b)=>a+b,0);
  const order=raw.map((r,i)=>({i,frac:r-Math.floor(r)})).sort((x,y)=>y.frac-x.frac);
  let gi=0;
  while(diff>0){alloc[order[gi%order.length].i]++;diff--;gi++;}
  while(diff<0){const idx=alloc.map((v,i)=>({v,i})).filter(x=>x.v>1).sort((x,y)=>y.v-x.v)[0];if(!idx)break;alloc[idx.i]--;diff++;}
  if(n>=10){const capA=3,capE=2;
    if(alloc[0]>capA){alloc[2]+=alloc[0]-capA;alloc[0]=capA;}
    if(alloc[4]>capE){alloc[2]+=alloc[4]-capE;alloc[4]=capE;}}
  let cur=1;
  return PHASES.map((p,i)=>{const from=cur,to=cur+alloc[i]-1;cur=to+1;return{...p,from,to};});
}
function planFor(a){
  const {ranked}=priorities(a);
  const top=ranked.filter(x=>x.state!=="exclude").slice(0,3);
  const d1=top[0]&&DOMAINS[top[0].dom],d2=top[1]&&DOMAINS[top[1].dom],d3=top[2]&&DOMAINS[top[2].dom];
  const phases=splitSessions(a.pkg||10);
  const flagged=Object.entries(a.tests||{}).filter(([,r])=>r&&r.items&&Object.values(r.items).some(Boolean)).map(([id])=>id);
  const cand=[...new Set(top.flatMap(t=>DOMAINS[t.dom].retest))];
  const retestIds=cand.filter(i=>flagged.includes(i)).concat(cand.filter(i=>!flagged.includes(i))).slice(0,4);
  const rows=phases.map(p=>{
    let focus=[],dir=[];
    if(p.key==="A"){focus=["호흡·기본 인지"].concat(d1?[d1.ko]:[]);
      dir=["호흡과 흉곽·골반 위치 인지부터 시작","주요 보상 패턴이 어떤 상황에서 나타나는지 확인","회원이 반응하는 큐잉 방식 파악"];
      if(d1)dir.push(d1.ko+": "+d1.early);}
    else if(p.key==="B"){focus=d1?[d1.ko]:["기초 조절"];
      dir=(d1?[d1.early,d1.mid]:["기본 조절 능력 확보"]).concat(["양측 지지·저부하 위주로 성공 경험 확보"]);}
    else if(p.key==="C"){focus=[d1&&d1.ko,d2&&d2.ko].filter(Boolean);
      dir=[d1&&d1.ko+": "+d1.late,d2&&d2.ko+": "+d2.early+" → "+d2.mid,"부하와 지지면 난도를 한 단계씩 올림"].filter(Boolean);}
    else if(p.key==="D"){focus=[d3&&d3.ko,"전신 통합"].filter(Boolean);
      dir=[d3&&d3.ko+": "+d3.early,"확보한 조절을 서 있는 자세·복합 동작으로 연결","회원 목표 활동과 닮은 움직임으로 전환"].filter(Boolean);}
    else{focus=["재평가"];
      dir=["초도 평가 항목 중 아래 검사를 다시 수행","변화가 없는 항목은 접근 방식 자체를 재검토","다음 등록 구간의 우선순위 재설정"];}
    return{...p,focus,dir,retest:(p.key==="E"||p.key==="A")?retestIds:[]};
  });
  return {rows,top,retestIds};
}

    out.push("신경 증상: 저림이 재현되는 자세는 피하고, 새로 생긴 힘 빠짐은 의료 확인을 먼저 권하기");
  if(has("현훈·전정기능 이상"))out.push("어지럼 이력: 머리 위치가 빠르게 바뀌는 동작과 눈 감기 과제를 천천히 도입");

  /* 낙상 */
  if((P.fall||[]).length)
    out.push("낙상 위험: 기구 승하차와 지지물 위치를 먼저 정하고, 균형 과제는 지지 조건을 단계적으로 줄이기");

  /* 약 */
  if((P.medEffects||[]).length)
    out.push("복용약 반응("+P.medEffects.join(", ")+"): 자세 전환 속도와 수업 시작 강도를 낮추고 반응을 확인");
  if((P.medTags||[]).includes("항응고제·항혈소판제"))out.push("항응고제: 강한 압박·도수 자극과 충격 동작을 피하기");
  if((P.meds||{}).note)out.push("약 관련 안내: "+P.meds.note);

  /* 수술 · 재활 */
  (P.surgeries||[]).forEach(s=>{
    if(s.limit&&s.limit!=="제한 없음")out.push([s.name,s.side].filter(Boolean).join(" ")+": "+s.limit);
    if(s.note)out.push([s.name,"허용·금지"].filter(Boolean).join(" ")+" — "+s.note);
  });

  /* 운동 중 증상 */
  if((P.exsym||[]).length)
    out.push("운동 중 증상 보고("+P.exsym.join(", ")+"): 증상이 재현되면 중단하고 의료 확인을 권하기");

  /* 통증 · 회복 */
  const mp=mainPain(P),PD=P.painDetail||{};
  const nrs=parseInt(mp.nrs||pn.nrsNow||P.nrs,10);
  if(!isNaN(nrs)&&nrs>=5)out.push((mp.site?mp.site+" ":"")+"불편감이 높은 편입니다. 통증이 재현되지 않는 범위에서 시작하고 수업 중 반응을 기록하세요");
  if((P.painSites||[]).length>=3)
    out.push("불편 부위가 여러 곳입니다. 주 호소 부위 한 곳을 기준으로 수업을 구성하고 나머지는 반응만 관찰하세요");
  Object.keys(PD).forEach(s=>{const d=PD[s]||{};
    if(d.trend==="최근 나빠지는 중")out.push(s+": 최근 악화 중 — 부하를 올리기 전에 증상 변화를 먼저 확인");
    if(d.aggravate)out.push(s+" 심해지는 상황: "+d.aggravate);
    if(d.relieve)out.push(s+" 편해지는 상황: "+d.relieve+" — 이 방향을 수업 초반에 활용");});
  if(pn.trend==="최근 나빠지는 중")out.push("최근 악화 중: 부하를 올리기 전에 증상 변화를 먼저 확인하세요");
  if(L.recovery==="48시간 이상 불편함")out.push("지난 수업 후 회복이 느렸습니다. 전체 볼륨을 줄이고 한 가지 과제만 진행하세요");
  if(L.fear==="많이 있음")out.push("운동에 대한 두려움이 큽니다. 성공하는 범위에서 시작하고 무엇을 왜 하는지 설명하세요");
  if(parseInt(P.sensitivity,10)>=4)out.push("예민함 정도가 높습니다. 자극 강도와 새 동작 수를 줄이고 회복 반응을 다음 수업에서 확인하세요");
  return out;
}
function cueGuide(m,a){
  const c=a.cues||{},out=[];
  if(c.tactile==="잘 반응")out.push("촉각 큐잉에 잘 반응합니다. 새 동작은 손으로 위치를 짚어주며 시작하세요");
  if(c.verbal==="반응 낮음")out.push("언어 설명보다 시범이나 촉각 큐를 먼저 쓰세요");
  if(c.visual==="잘 반응")out.push("거울이나 시범을 적극적으로 활용하세요");
  if(c.lowload==="낮음"&&c.highload!=="낮음")out.push("저부하에서는 인지가 어렵습니다. 스프링 저항이나 밴드로 감각 입력을 준 뒤 부하를 낮추는 순서로 진행하세요");
  if(c.eyesclosed==="뚜렷이 저하")out.push("시각에 많이 의존합니다. 눈 감기·불안정 지지면 과제를 단계적으로 넣어보세요");
  if(c.cuecount==="한 번에 하나")out.push("지시는 한 번에 하나씩. 동작당 핵심 큐 하나만 정해두세요");
  if(c.learning==="느림"||c.focus==="짧은 편")out.push("동작 수를 줄이고 반복 횟수를 늘리는 구성이 효율적입니다");
  if(c.sidediff&&c.sidediff!=="없음")out.push(`${c.sidediff.replace("이 둔함","")} 쪽 감각 인지가 낮습니다. 그쪽을 먼저 수행하고 더 많은 큐를 주세요`);
  if(c.paincaution==="높음"||parseInt(m.profile.sensitivity,10)>=4)out.push("통증·자극에 대한 경계가 높습니다. 성공하는 범위에서 시작하고 무엇을 왜 하는지 설명하세요");
  return out;
}

let S={screen:"gate",gate:"login",mode:"coach",memberId:null,step:0,draft:null,viewAssessId:null,
  editProfile:false,q:"",filter:"all",addAdmin:false,grantFor:null,intakeSec:"basic",since:[]};

const member=()=>memberById(S.memberId);
const ROOTS=["members","classes","news","settings","staff"];
let lastKey="";

function go(patch,root){
  if(root)Nav.stack=[];else Nav.push({screen:S.screen,memberId:S.memberId,step:S.step,viewAssessId:S.viewAssessId});
  Object.assign(S,patch);render();
}
function goBack(){
  const p=Nav.pop();

}
function chip(k,label,on,cls){return `<button class="chip ${cls||""}" data-chip="${k}" aria-pressed="${on?"true":"false"}">${esc(label)}</button>`;}
function prow(store,it,prefix){
  const key=id=>(prefix?prefix+"|":"")+id,cls=it.caution?"caution":"";
  const btn=(id,label)=>`<button class="${cls}" data-chip="${key(id)}" aria-pressed="${store[id]?"true":"false"}">${label}</button>`;
  return `<div class="prow"><span class="pn">${esc(it.t)}</span><span class="lr">${
    it.s?btn(it.id+":좌","좌")+btn(it.id+":우","우")
       :`<button class="one ${cls}" data-chip="${key(it.id)}" aria-pressed="${store[it.id]?"true":"false"}">해당</button>`}</span></div>`;
}
function render(){
  if(!SESSION)S.screen="gate";
  const y=window.scrollY||0,key=S.screen+"|"+S.memberId+"|"+S.step+"|"+S.viewAssessId;
  view().innerHTML=(VIEWS[S.screen]||VIEWS.members)();
  chrome();dock();tabbar();
  if(key===lastKey)window.scrollTo(0,y);else window.scrollTo(0,0);
  lastKey=key;
}
function syncBadge(){
  const el=document.getElementById("sync");if(!el)return;
  el.className="syncdot "+(Sync.state.error?"err":(Sync.on()?"on":""));
  el.innerHTML=`<i></i>${Sync.on()?(Sync.state.error?"동기화 오류":(Sync.state.last?"동기화 "+Sync.state.last:"서버 연결됨")):"이 기기에만 저장"}`;
}
function chrome(){
  const back=document.getElementById("back");

function tabbar(){
  const el=document.getElementById("tabs");
  if(!SESSION||S.screen==="assess"||S.screen==="gate"){el.innerHTML="";document.body.classList.remove("hastabs");return;}

const INTAKE_SECS=[
  ["basic","기본 · 목적"],["pain","통증"],["dx","진단 · 병력"],["surgery","수술 · 재활"],
  ["neuro","신경 · 운동 중 증상"],["women","임신 · 골반저"],["balance","균형 · 관절"],
  ["meds","복용약"],["life","생활 · 회복"],["safety","안전 신호"]
];
function secCount(P,k){
  const n=a=>(a||[]).length;
  if(k==="basic")return n(P.goals)+n(P.habits)+n(P.special)+(P.job?1:0)+(P.experience?1:0);
  if(k==="pain")return n(P.painSites)+Object.values(P.pain||{}).filter(Boolean).length
    +Object.values(P.painDetail||{}).reduce((s,d)=>s+Object.values(d||{}).filter(Boolean).length,0);
  if(k==="dx")return n(P.diagnoses)+n(P.discomforts)+(P.diagnosesEtc?1:0);
  if(k==="surgery")return n(P.surgeries)+(P.injury?1:0);
  if(k==="neuro")return n(P.neuro)+n(P.exsym);
  if(k==="women")return n(P.pelvic)+Object.values(P.perinatal||{}).filter(Boolean).length;
  if(k==="balance")return n(P.fall)+n(P.joint);
  if(k==="meds")return n(P.medTags)+n(P.medEffects)+Object.values(P.meds||{}).filter(Boolean).length;
  if(k==="life")return Object.values(P.life||{}).filter(Boolean).length;
  if(k==="safety")return n(P.urgent)+watchOf({profile:P}).length;
  return 0;
}

function safetyBanner(m){
  const u=urgentOf(m);if(!u.length)return "";
  return `<div class="urgentbar"><h4>의료 평가를 먼저 안내해 주세요</h4>
    <ul>${u.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
    <p>이 상태에서는 운동 우선순위를 만들지 않습니다. 흉통·호흡곤란·한쪽 마비·갑작스러운 심한 두통은 119 등 응급 대응이 필요할 수 있습니다.</p></div>`;
}
function intakeSummary(m){
  const P=m.profile,w=watchOf(m);
  const line=(l,v)=>v?`<span class="pill">${l}</span>${esc(v)}<br>`:"";
  const pn=P.pain||{};
  return safetyBanner(m)+`<div class="panel">
    <div class="srow" style="justify-content:space-between">
      <div><h3>문진 요약</h3><p class="sub" style="margin-bottom:0">필요한 항목만 채워도 됩니다</p></div>
      <button class="btn" data-go="intake">문진 열기</button></div>
    <div class="sumline mt16">
      ${line("목적",(P.goals||[]).join(", "))}
      ${line("통증",painLine(P))}
      ${line("느낌",mainPain(P).quality||pn.quality)}
      ${line("진단",(P.diagnoses||[]).concat(P.diagnosesEtc?[P.diagnosesEtc]:[]).join(", "))}
      ${line("수술",(P.surgeries||[]).map(s=>[s.name,s.side,s.stage].filter(Boolean).join(" ")).join(" / "))}
      ${line("신경",(P.neuro||[]).join(", "))}
      ${line("골반저",(P.pelvic||[]).join(", "))}
      ${line("약",(P.medTags||[]).join(", "))}
      ${line("특이",(P.special||[]).join(", "))}
      ${P.sensitivity?`<span class="pill">예민함</span>${esc(P.sensitivity)}/5<br>`:""}
      ${w.length?`<span class="pill">확인 권장</span>${esc(w.join(", "))}`:""}
      ${!(P.goals||[]).length&&!(P.diagnoses||[]).length&&!(P.painSites||[]).length?`<span class="hint">아직 작성된 문진이 없습니다.</span>`:""}
    </div></div>`;
}
function memberView(){

      <div><h2>${esc(m.name)}</h2>
        <p class="sub" style="margin-bottom:0">${esc([m.sex,m.dob?"생년월일 "+dobLine(m.dob):"",telFmt(m.phone)].filter(Boolean).join(" · ")||"기본 정보 없음")}</p></div>

function priorityMini(a){
  const top=priorities(a).ranked.filter(x=>x.state!=="exclude").slice(0,3);
  return `<div class="panel"><h3>최근 우선순위</h3><p class="sub">${esc(fmt(a.date))} ${esc(a.type)} 기준</p>
    ${top.map((x,i)=>`<div class="prio"><div class="ptop"><span class="rank">${i+1}순위</span><h4>${DOMAINS[x.dom].ko}</h4>
      <span class="badge ${x.confirmed?"":"gold"}">${x.confirmed?"움직임에서 확인됨":"추가 확인 필요"}</span></div>
      <p>${esc(DOMAINS[x.dom].early)}</p></div>`).join("")||`<p class="hint">체크된 항목이 없습니다.</p>`}
    <div class="srow mt16"><button class="btn sm" data-report="${a.id}">리포트 보기</button></div></div>`;
}
const secTotal=m=>INTAKE_SECS.reduce((n,[k])=>n+secCount(m.profile,k),0);

function steps(){
  const a=S.draft,l=[{k:"overview",t:"평가 개요"}];
  if(a.scope.photos)l.push({k:"photos",t:"평가 사진"});
  if(a.scope.statics)l.push({k:"statics",t:"정적 관찰"});
  if(a.scope.tests)l.push({k:"tests",t:"움직임 평가"});
  if(a.scope.cues)l.push({k:"cues",t:"큐잉 반응"});
  l.push({k:"result",t:"우선순위"},{k:"plan",t:"수업 설계"});return l;
}
function stepCount(k){
  const a=S.draft;
  if(k==="photos")return PHOTOSLOTS.filter(s=>a.photos[s.k]).length+((a.photos.extra||[]).length);
  if(k==="statics")return Object.values(a.statics).filter(Boolean).length;
  if(k==="tests")return Object.values(a.tests).reduce((n,r)=>n+(r&&r.items?Object.values(r.items).filter(Boolean).length:0),0);
  if(k==="cues")return Object.keys(a.cues).filter(x=>x!=="_memo").length;
  return 0;
}
function assessView(){

  return `<div class="split">${rail}<div>${

function compareBlock(p,a){
  const sp=score(p),sa=score(a);
  const rows=DORDER.filter(k=>sp[k].total||sa[k].total).map(k=>{const d=sa[k].total-sp[k].total;
    return `<tr><td class="ph">${DOMAINS[k].ko}</td><td>${sp[k].total}</td><td>${sa[k].total}</td>
      <td>${d===0?"변화 없음":(d<0?"소견 감소 "+d:"소견 증가 +"+d)}</td></tr>`;}).join("");
  return `<div class="panel"><h3>이전 평가와 비교</h3><p class="sub">${esc(fmt(p.date))} → ${esc(fmt(a.date))}</p>
    <table class="plan"><thead><tr><th>영역</th><th>이전</th><th>현재</th><th>변화</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function toggleArr(arr,v){const i=arr.indexOf(v);if(i<0)arr.push(v);else arr.splice(i,1);}
function saveDraft(silent){
  const m=member();if(!m||!S.draft)return;
  touch(S.draft);touch(m);
  const i=m.assessments.findIndex(x=>x.id===S.draft.id);
  if(i<0)m.assessments.push(S.draft);else m.assessments[i]=S.draft;
  m.assessments.sort((a,b)=>a.date<b.date?-1:1);
  persist().then(ok=>{if(!silent&&ok)toast("평가를 저장했습니다");});
}
function goStep(i){saveDraft(true);S.step=i;render();}
function shrink(file,cb){
  const r=new FileReader();
  r.onload=()=>{const img=new Image();
    img.onload=()=>{const max=1000;let w=img.width,h=img.height;const s=Math.min(1,max/Math.max(w,h));
      w=Math.round(w*s);h=Math.round(h*s);
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);cb(c.toDataURL("image/jpeg",.7));};
    img.onerror=()=>toast("이미지를 읽을 수 없습니다");img.src=r.result;};
  r.readAsDataURL(file);
}

    const no=parseInt(v("sno"),10)||live(m.sessions).length+1;
    const s=touch({id:uid(),no,date:validDate(v("sdate"))?v("sdate"):today(),time:v("stime"),room:v("sroom"),
      equip:v("sequip"),content:v("scontent"),response:v("sresp"),homework:v("shw"),next:v("snext"),
      special:v("sspec"),recovery:v("srec"),since:(S.since||[]).slice()});
    S.since=[];
    m.sessions.push(s);
    if(s.special)m.notes.push(touch({id:uid(),date:s.date,text:s.special,src:"수업 "+no+"회차"}));
    touch(m);persist();render();toast("수업을 기록했습니다");}
  else if(act==="addon"){
    const val=document.getElementById("addon").value;if(!val)return;
    a.addons=a.addons||[];if(!a.addons.includes(val))a.addons.push(val);
    if(a.overrides&&a.overrides[val]==="exclude")delete a.overrides[val];render();}
  else if(act==="prevStep")goStep(Math.max(0,S.step-1));
  else if(act==="nextStep")goStep(Math.min(steps().length-1,S.step+1));
  else if(act==="save"){saveDraft(false);S.viewAssessId=S.draft.id;}
  else if(act==="reportNow"){saveDraft(true);go({screen:"report",viewAssessId:S.draft.id});}
  else if(act==="print")window.print();
  else if(act==="export"){
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob),l=document.createElement("a");
    l.href=url;l.download="movemap-"+today()+".json";l.click();URL.revokeObjectURL(url);}
  else if(act==="import"){
    const f=document.createElement("input");f.type="file";f.accept="application/json";
    f.onchange=()=>{const r=new FileReader();
      r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.members&&!d.staff)throw 0;
        DB=mergeDB(DB,Object.assign(emptyDB(),d));persist({noSync:true});render();
        toast("불러왔습니다 · 강사 "+live(DB.staff).length+"명");}catch(err){toast("파일을 읽을 수 없습니다");}};
      r.readAsText(f.files[0]);};
    f.click();}
});

document.addEventListener("input",e=>{
  const el=e.target,a=S.draft,m=member();
  if(el.dataset.mask==="date"){const p=maskDate(el.value);if(p!==el.value)el.value=p;
    if(el.dataset.dobauto){const o=document.getElementById(el.dataset.dobauto);
      if(o)o.textContent=validDate(p)&&ageOf(p)?ageOf(p)+"세":"";}
    if(el.dataset.bind&&a)a[el.dataset.bind]=p;
    return;}
  if(el.dataset.mask==="tel"){const p=telFmt(el.value);if(p!==el.value)el.value=p;return;}
  if(el.dataset.q!==undefined){S.q=el.value;const box=view().querySelector(".panel.flush");
    if(box){const tmp=document.createElement("div");tmp.innerHTML=isAdmin()?adminMembersView():membersView();
      const src2=tmp.querySelector(".panel.flush");if(src2)box.innerHTML=src2.innerHTML;}return;}
  if(el.dataset.prof&&m){m.profile[el.dataset.prof]=el.value;touch(m);persist();}
  else if(el.dataset.sync){DB.sync=DB.sync||{};DB.sync[el.dataset.sync]=el.value.trim();persist({noSync:true});syncBadge();}
  else if(el.dataset.field&&a)a[el.dataset.field]=el.value;
  else if(el.dataset.testnote&&a){const id=el.dataset.testnote;a.tests[id]=a.tests[id]||{done:true,items:{},note:""};a.tests[id].note=el.value;}
  else if(el.dataset.cuememo&&a)a.cues._memo=el.value;
  else if(el.dataset.pkgcustom&&a){const n=parseInt(el.value,10);
    if(n>0&&n<=60){a.pkg=n;const w=document.querySelector("#view table.plan");
      if(w){w.outerHTML=planTable(a);
        document.querySelectorAll("[data-pkg]").forEach(b=>b.setAttribute("aria-pressed",parseInt(b.dataset.pkg,10)===a.pkg));}}}
});
document.addEventListener("change",e=>{
  const el=e.target,a=S.draft,m=member();
  if(el.dataset.centerpick){setCenter(el.value).then(()=>{S.memberId=null;go({screen:"members"},true);});return;}
  if(el.dataset.photo!==undefined&&a){
    const k=el.dataset.photo;let files=[...el.files];if(!files.length)return;
    a.photos=a.photos||{extra:[]};a.photos.extra=a.photos.extra||[];
    if(k==="extra")files=files.slice(0,MAX_EXTRA_PHOTOS-a.photos.extra.length);
    if(!files.length){toast("추가 사진은 "+MAX_EXTRA_PHOTOS+"장까지입니다");return;}
    let left=files.length;
    files.forEach(f=>shrink(f,d=>{
      if(k==="extra"){if(a.photos.extra.length<MAX_EXTRA_PHOTOS)a.photos.extra.push({data:d});}
      else if(k.indexOf("extra:")===0){const i=parseInt(k.split(":")[1],10);if(a.photos.extra[i])a.photos.extra[i].data=d;}
      else a.photos[k]=d;
      if(--left===0){saveDraft(true);render();}}));
    return;}
  if(el.dataset.prof&&m){m.profile[el.dataset.prof]=el.value;touch(m);persist();return;}
  if(el.dataset.field&&a){a[el.dataset.field]=el.value;render();}
});

      <div><label class="f" for="ce">영문 표기</label><input id="ce" type="text" data-center="en" value="${esc(c.en||"")}"></div>
      <div><label class="f" for="cc">센터 코드</label><input id="cc" type="text" data-center="code" value="${esc(c.code||"")}"></div>

    ${isOwner()?`<div class="mt16"><button class="btn sm" data-admact="addCenter">센터(지점) 추가</button></div>`:""}</div>`;
}

/* ============================================================
   어드민 이벤트
   ============================================================ */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-admact],[data-admdel],[data-rp]");
  if(!t)return;
  e.preventDefault();

  /* 권한 그룹 체크 */
  if(t.dataset.rp){
    if(!can("roles"))return;
    const [rid,k]=t.dataset.rp.split("|"),r=roleById(rid);if(!r)return;
    r.perms=r.perms||{};r.perms[k]=r.perms[k]?0:1;touch(r);persist();
    t.setAttribute("aria-pressed",r.perms[k]?"true":"false");return;
  }

  /* 삭제 */
  if(t.dataset.admdel){
    if(!can("del")&&t.dataset.admdel.split("|")[0]!=="role"){toast("삭제 권한이 없습니다");return;}
    const [kind,id]=t.dataset.admdel.split("|");
    const m=member();
    const kill=o=>{if(o){o.deleted=true;touch(o);}};
    if(kind==="member"){const x=memberById(id);if(!x)return;
      if(!confirm(x.name+" 회원을 삭제할까요? 평가·수업 기록이 함께 사라집니다."))return;
      kill(x);persist();toast("회원을 삭제했습니다");
      if(S.screen==="member"){go({screen:"members",memberId:null},true);return;}}
    else if(kind==="staff"){const x=staffById(id);if(!x)return;
      if(members().some(y=>y.ownerId===id)){toast("담당 회원을 먼저 다른 강사에게 옮겨 주세요");return;}
      if(!confirm(x.name+" 강사를 명단에서 삭제할까요?"))return;kill(x);persist();toast("삭제했습니다");}
    else if(kind==="admin"){if(!isOwner()){toast("대표관리자만 할 수 있습니다");return;}
      const x=(DB.admins||[]).find(a=>a.id===id);if(!x||x.role==="owner")return;
      if(!confirm(x.name+" 계정을 삭제할까요?"))return;kill(x);persist();toast("삭제했습니다");}
    else if(kind==="role"){if(!can("roles")){toast("권한이 없습니다");return;}
      const x=roleById(id);if(!x)return;
      if(adminsOf().some(a=>a.roleId===id)){toast("이 그룹을 쓰는 계정이 있습니다. 먼저 다른 그룹으로 바꿔 주세요");return;}
      kill(x);persist();toast("그룹을 삭제했습니다");}
    else if(kind==="room"){const x=(DB.rooms||[]).find(r=>r.id===id);kill(x);persist();}
    else if(kind==="assess"&&m){kill(live(m.assessments).find(x=>x.id===id));touch(m);persist();toast("평가를 삭제했습니다");}
    else if(kind==="session"&&m){kill(live(m.sessions).find(x=>x.id===id));touch(m);persist();toast("수업 기록을 삭제했습니다");}
    else if(kind==="note"&&m){kill(live(m.notes).find(x=>x.id===id));touch(m);persist();toast("특이사항을 삭제했습니다");}
    render();return;
  }

  const [act,arg]=t.dataset.admact.split("|");

  if(act==="addStaff"){
    if(!can("staff_edit")){toast("권한이 없습니다");return;}
    const name=v("st_name"),tel=digits(v("st_tel"));
    if(!name||!tel){toast("이름과 전화번호를 입력하세요");return;}
    const ex=live(DB.staff).find(s=>digits(s.phone)===tel);
    if(ex){ex.centers=ex.centers||[];
      if(ex.centers.includes(CENTER_ID)){toast("이미 이 센터에 등록된 번호입니다");return;}
      ex.centers.push(CENTER_ID);touch(ex);persist();render();toast(ex.name+" 강사를 이 센터에 추가했습니다");return;}
    DB.staff.push(touch({id:uid(),name,phone:tel,dob:"",email:"",userid:"",pw:"",centers:[CENTER_ID],active:true,createdAt:today()}));
    persist();render();toast(name+" 강사를 명단에 추가했습니다");}
  else if(act==="toggleStaff"){const s=staffById(arg);if(!s)return;
    s.active=s.active===false;touch(s);persist();render();}
  else if(act==="grantAdmin"){S.grantFor=arg;render();}
  else if(act==="cancelGrant"){S.grantFor=null;render();}
  else if(act==="saveGrant"){
    const s=staffById(arg);if(!s)return;
    const id=v("ga_id").toLowerCase(),pw=document.getElementById("ga_pw").value,rid=v("ga_role");
    if(!/^[a-z0-9_]{3,}$/.test(id)){toast("아이디는 영문·숫자 3자 이상");return;}
    if(live(DB.admins).some(a=>(a.userid||"").toLowerCase()===id)){toast("이미 쓰고 있는 아이디입니다");return;}
    if(pw.length<4){toast("비밀번호는 4자 이상");return;}
    DB.admins.push(touch({id:uid(),centerId:CENTER_ID,centers:[CENTER_ID],staffId:s.id,name:s.name,phone:s.phone,
      dob:s.dob||"",email:s.email||"",userid:id,pw,role:"manager",roleId:rid,active:true,createdAt:today()}));
    S.grantFor=null;persist();render();toast(s.name+" 강사에게 어드민 권한을 주었습니다");}
  else if(act==="toAddAdmin"){S.addAdmin=true;render();}
  else if(act==="cancelAdmin"){S.addAdmin=false;render();}
  else if(act==="addAdmin"){
    if(!isOwner()){toast("대표관리자만 할 수 있습니다");return;}
    const name=v("na_name"),tel=digits(v("na_tel")),dob=v("na_dob"),mail=v("na_mail"),
      id=v("na_id").toLowerCase(),pw=document.getElementById("na_pw").value,rid=v("na_role");
    if(!name||!tel){toast("이름과 전화번호를 입력하세요");return;}
    if(dob&&!validDate(dob)){toast("생년월일을 0000-00-00 형식으로 입력하세요");return;}
    if(!/^[a-z0-9_]{3,}$/.test(id)){toast("아이디는 영문·숫자 3자 이상");return;}
    if(live(DB.admins).some(a=>(a.userid||"").toLowerCase()===id)){toast("이미 쓰고 있는 아이디입니다");return;}
    if(pw.length<4){toast("비밀번호는 4자 이상");return;}
    DB.admins.push(touch({id:uid(),centerId:CENTER_ID,centers:[CENTER_ID],name,phone:tel,dob,email:mail,
      userid:id,pw,role:"manager",roleId:rid,active:true,createdAt:today()}));
    S.addAdmin=false;persist();render();toast(name+" 계정을 추가했습니다");}
  else if(act==="toggleAdmin"){if(!isOwner())return;
    const a=(DB.admins||[]).find(x=>x.id===arg);if(!a||a.role==="owner")return;
    a.active=a.active===false;touch(a);persist();render();}
  else if(act==="addRole"){
    if(!can("roles")){toast("권한이 없습니다");return;}
    const nm=v("newrole");if(!nm){toast("그룹 이름을 입력하세요");return;}
    DB.roles=DB.roles||[];
    DB.roles.push(touch({id:uid(),centerId:CENTER_ID,name:nm,perms:{members_view:1,classes:1},order:rolesOf().length}));
    persist();render();toast(nm+" 그룹을 만들었습니다");}
  else if(act==="addRoom"){
    if(!can("rooms")){toast("권한이 없습니다");return;}
    const nm=v("rm");if(!nm){toast("룸 이름을 입력하세요");return;}
    DB.rooms.push(touch({id:uid(),centerId:CENTER_ID,name:nm,order:rooms().length}));
    persist();render();toast("룸을 추가했습니다");}
  else if(act==="switchCenter"){setCenter(arg).then(()=>go({screen:"members",memberId:null},true));}
  else if(act==="addCenter"){
    if(!isOwner()){toast("대표관리자만 할 수 있습니다");return;}
    const nm=prompt("새 센터(지점) 이름");if(!nm)return;
    const c=touch({id:uid(),name:nm.trim(),en:"",code:"",createdAt:today()});
    DB.centers.push(c);seedRoles(c.id);
    SESSION.centers=(SESSION.centers||[SESSION.centerId]).filter(Boolean);SESSION.centers.push(c.id);
    touch(SESSION);persist();setCenter(c.id).then(()=>go({screen:"settings"},true));
    toast(nm+" 센터를 만들었습니다");}
});

/* 셀렉트·입력 */
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.owner!==undefined){
    if(!can("members_edit")){toast("권한이 없습니다");render();return;}
    const m=memberById(el.dataset.owner);if(!m)return;
    m.ownerId=el.value||"";touch(m);persist();toast("담당 강사를 바꿨습니다");return;}
  if(el.dataset.move!==undefined){
    if(!can("staff_edit"))return;
    const from=el.dataset.move,to=el.value;if(!to)return;
    const list=members().filter(m=>m.ownerId===from);
    if(!list.length){toast("옮길 회원이 없습니다");el.value="";return;}
    if(!confirm(list.length+"명을 옮길까요?")){el.value="";return;}
    list.forEach(m=>{m.ownerId=to==="none"?"":to;touch(m);});
    persist();render();toast(list.length+"명을 옮겼습니다");return;}
  if(el.dataset.adminrole!==undefined){
    if(!isOwner())return;
    const a=(DB.admins||[]).find(x=>x.id===el.dataset.adminrole);if(!a)return;
    a.roleId=el.value;touch(a);persist();toast("권한 그룹을 바꿨습니다");return;}
  if(el.dataset.filter!==undefined){S.filter=el.value;render();return;}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.room!==undefined){const r=(DB.rooms||[]).find(x=>x.id===el.dataset.room);
    if(r){r.name=el.value;touch(r);persist();}return;}
  if(el.dataset.rolename!==undefined){const r=roleById(el.dataset.rolename);
    if(r){r.name=el.value;touch(r);persist();}return;}
  if(el.dataset.center!==undefined){const c=curCenter();
    if(c&&can("settings")){c[el.dataset.center]=el.value;touch(c);persist();
      const cn=document.getElementById("cname");if(cn)cn.innerHTML=esc(centerName())+(isAdmin()?' <span>어드민</span>':"");}return;}
});

/* ---------- 문진 입력 저장 ---------- */
function saveIntake(el){
  const m=member();if(!m)return false;
  const P=m.profile;let hit=false;
  if(el.dataset.pobj!==undefined){
    const [o,f]=el.dataset.pobj.split("|");
    if(o==="__prof")P[f]=el.value; else {P[o]=P[o]||{};P[o][f]=el.value;}
    hit=true;
  }else if(el.dataset.cond!==undefined){
    const [n,f]=el.dataset.cond.split("|");
    P.conditions=P.conditions||{};P.conditions[n]=P.conditions[n]||{};
    P.conditions[n][f]=el.value;hit=true;
  }else if(el.dataset.pdet!==undefined){
    const p=el.dataset.pdet.split("|");
    P.painDetail=P.painDetail||{};P.painDetail[p[0]]=P.painDetail[p[0]]||{};
    P.painDetail[p[0]][p[1]]=el.value;hit=true;
  }else if(el.dataset.surg!==undefined){
    const [i,f]=el.dataset.surg.split("|");
    P.surgeries=P.surgeries||[];
    if(P.surgeries[i]){P.surgeries[i][f]=el.value;hit=true;}
  }
  if(hit){touch(m);persist();}
  return hit;
}
document.addEventListener("input",e=>{saveIntake(e.target);});
document.addEventListener("change",e=>{saveIntake(e.target);});
